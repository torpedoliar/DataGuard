name: CI / CD Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests (Backup & Core)
        run: npx vitest run lib/backup

  deploy:
    name: Deploy to Local Server (Self-Hosted)
    needs: ci-check
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run Update Script
        run: |
          echo "==> Masuk ke direktori dc-check..."
          cd /home/administrator/dc-check
          echo "==> Menjalankan update.sh..."
          chmod +x update.sh
          ./update.sh
