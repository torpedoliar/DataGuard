name: CI / CD Deploy to Production

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  ci-check:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit Tests (Backup & Deployment)
        run: npx vitest run lib/backup scripts/watchguard-deployment.test.ts scripts/watchguard-worker.test.ts

  deploy:
    name: Deploy to Local Server (Self-Hosted)
    needs: ci-check
    runs-on: self-hosted
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Run Update Script
        shell: bash
        run: |
          set -euo pipefail
          echo "==> Masuk ke direktori dc-check..."
          cd /home/administrator/dc-check
          if [ "$(git branch --show-current)" != "main" ]; then
            echo "ERROR: Deployment checkout must be on main. No files were discarded."
            exit 1
          fi
          echo "==> Memperbarui source sebelum menjalankan script deployment..."
          git pull --ff-only origin main
          git log -1 --format='Deployment source: %h %s'
          echo "==> Menjalankan update.sh..."
          chmod +x update.sh
          ./update.sh

      - name: Verify WatchGuard Worker Container
        shell: bash
        run: |
          set -euo pipefail
          # Inspect state only; never print environment or start an extra sync.
          worker=dccheck_watchguard_worker
          for attempt in {1..6}; do
            state="$(docker inspect --format '{{.State.Status}}' "$worker" 2>/dev/null || true)"
            restarts="$(docker inspect --format '{{.RestartCount}}' "$worker" 2>/dev/null || true)"
            if [ "$state" != "running" ] || [ "$restarts" != "0" ]; then
              echo "ERROR: WatchGuard worker is missing, stopped, or restarting. Inspect worker logs on the server."
              exit 1
            fi
            if [ "$attempt" -lt 6 ]; then sleep 5; fi
          done
          echo "OK: WatchGuard worker remained running during the startup check (sync success is verified separately)."
