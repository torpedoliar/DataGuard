<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Offline — DataGuard</title>
<style>
  :root { color-scheme: dark; }
  body {
    margin: 0;
    min-height: 100vh;
    display: grid;
    place-items: center;
    background: #0b1120;
    color: #f8fafc;
    font-family: system-ui, -apple-system, "Segoe UI", Inter, sans-serif;
    text-align: center;
    padding: 2rem;
  }
  main { max-width: 28rem; }
  .badge {
    width: 56px; height: 56px; margin: 0 auto 1.25rem;
    border-radius: 14px;
    background: #5eead4;
    color: #0b1120;
    display: grid; place-items: center;
    font-weight: 800; font-size: 1.4rem; letter-spacing: 0.04em;
  }
  h1 { font-size: 1.5rem; margin: 0 0 0.5rem; font-weight: 700; }
  p { color: #94a3b8; margin: 0; font-size: 1rem; line-height: 1.55; }
  button {
    margin-top: 1.5rem;
    padding: 0.6rem 1.2rem;
    border-radius: 8px;
    border: 1px solid #1e293b;
    background: #172033;
    color: #f8fafc;
    font-size: 0.9rem;
    cursor: pointer;
  }
</style>
</head>
<body>
<main>
  <div class="badge">DG</div>
  <h1>You're offline</h1>
  <p>Network is disconnected. Cached pages and queued audits are still available. Reconnect to sync.</p>
  <button onclick="location.reload()">Try again</button>
</main>
</body>
</html>
